<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080a16"><title>تجربه سه‌بعدی | KoutiNet</title><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/style.css"></head>
<body class="scene-page">
<header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">K</span><span>Kouti<span class="brand-accent">Net</span><small>IMMERSIVE EXPERIENCE</small></span></a><nav class="nav-links"><a href="index.html">صفحه اصلی</a><a class="active" href="3d.html">تجربه سه‌بعدی</a></nav><a class="header-cta" href="index.html#contact">ارتباط با ما <span>↗</span></a></header>
<main class="three-main"><div class="three-copy"><div class="eyebrow"><i></i> KOUTINET / 3D WORLD</div><h1>به جهان<br><span class="gradient-text">سه‌بعدی</span> خوش آمدید.</h1><p>گوی دیجیتال را با حرکت ماوس یا لمس صفحه بچرخانید و فضای تعاملی KoutiNet را تجربه کنید.</p><a class="btn btn-glass" href="index.html">← بازگشت به صفحه اصلی</a><div class="drag-hint">↔ برای چرخاندن، بکشید</div></div><div class="three-stage"><canvas id="world3d" aria-label="گوی سه بعدی تعاملی"></canvas><div class="stage-label"><span class="live-dot"></span> INTERACTIVE OBJECT <small>MOVE / DRAG</small></div><div class="stage-ring"></div></div></main>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const canvas=document.querySelector('#world3d');
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(42,1,.1,100);camera.position.set(0,0,7);
const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor(0x000000,0);
scene.add(new THREE.AmbientLight(0xffffff,1.4));
const key=new THREE.PointLight(0x9c72ff,32);key.position.set(3,3,4);scene.add(key);
const cyan=new THREE.PointLight(0x35e6e0,18);cyan.position.set(-3,-2,2);scene.add(cyan);
const group=new THREE.Group();scene.add(group);
const sphere=new THREE.Mesh(new THREE.IcosahedronGeometry(1.48,5),new THREE.MeshPhysicalMaterial({color:0x5b42c8,metalness:.48,roughness:.22,clearcoat:1,clearcoatRoughness:.12,wireframe:false}));group.add(sphere);
const wire=new THREE.Mesh(new THREE.IcosahedronGeometry(1.53,2),new THREE.MeshBasicMaterial({color:0x9c8aff,wireframe:true,transparent:true,opacity:.19}));group.add(wire);
const ringMat=new THREE.MeshBasicMaterial({color:0x55e5df,transparent:true,opacity:.75});
for(let i=0;i<3;i++){const ring=new THREE.Mesh(new THREE.TorusGeometry(2.05+i*.16,.009,8,180),ringMat);ring.rotation.set(.6+i*.7,.25+i*.35,.2);group.add(ring);}
const particles=new THREE.Group();const pGeo=new THREE.SphereGeometry(.025,8,8);const pMat=new THREE.MeshBasicMaterial({color:0x9b8aff});
for(let i=0;i<90;i++){const p=new THREE.Mesh(pGeo,pMat);const a=Math.random()*Math.PI*2,b=Math.acos(2*Math.random()-1),r=2.35+Math.random()*.65;p.position.set(r*Math.sin(b)*Math.cos(a),r*Math.sin(b)*Math.sin(a),r*Math.cos(b));particles.add(p);}scene.add(particles);
let targetX=0,targetY=0,drag=false,px=0,py=0;
canvas.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;py=e.clientY;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!drag)return;targetY+=(e.clientX-px)*.008;targetX+=(e.clientY-py)*.008;px=e.clientX;py=e.clientY});
canvas.addEventListener('pointerup',()=>drag=false);canvas.addEventListener('pointercancel',()=>drag=false);
function resize(){const r=canvas.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(canvas);resize();
function animate(t){requestAnimationFrame(animate);if(!drag){targetY+=.0018;}group.rotation.x+=(targetX-group.rotation.x)*.045;group.rotation.y+=(targetY-group.rotation.y)*.045;particles.rotation.y=t*.00008;particles.rotation.x=Math.sin(t*.0002)*.08;renderer.render(scene,camera);}animate(0);
</script></body></html>

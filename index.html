<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>مهندس مبین کوتی</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,#24366b 0%,#111a36 38%,#080c18 78%);color:#fff;font-family:Vazirmatn,Tahoma,sans-serif}
    main{text-align:center;padding:32px;position:relative;z-index:1}
    .mark{width:76px;height:76px;margin:0 auto 28px;border:1px solid #8299ff88;border-radius:24px;display:grid;place-items:center;color:#a9baff;font-size:34px;font-weight:900;box-shadow:0 0 55px #637cff44;background:#ffffff0b}
    h1{margin:0;font-size:clamp(2.3rem,8vw,5.5rem);font-weight:900;letter-spacing:-2px;background:linear-gradient(100deg,#fff 15%,#b9c8ff 55%,#8eeaff);-webkit-background-clip:text;background-clip:text;color:transparent}
    .line{width:90px;height:3px;margin:28px auto 0;border-radius:9px;background:linear-gradient(90deg,#8eeaff,#9a8cff)}
    .glow{position:absolute;width:340px;height:340px;border-radius:50%;background:#536dff22;filter:blur(80px);pointer-events:none}
  </style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <main>
    <div class="mark" aria-hidden="true">م</div>
    <h1>مهندس مبین کوتی</h1>
    <div class="line" aria-hidden="true"></div>
  </main>
</body>
</html>
